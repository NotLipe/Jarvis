<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S. // MISSION CONTROL</title>
<style>
:root{
  --bg:#020a18;
  --c:#5ad7ff;
  --c-hi:#bff2ff;
  --c-mid:#3aa9d8;
  --line:rgba(90,215,255,.38);
  --faint:rgba(90,215,255,.13);
  --txt:#a9e6fb;
  --muted:#6fb2cc;
  --warn:#ffb547;
  --glow:0 0 6px rgba(90,215,255,.6);
  --font:"Roboto Mono","Cousine","SFMono-Regular",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:var(--font);
  font-size:clamp(10px,.68vw + .12vh,13px);
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--txt);
  background:
    radial-gradient(ellipse 60% 55% at 50% 46%,rgba(24,86,150,.33),transparent 70%),
    linear-gradient(rgba(90,215,255,.045) 1px,transparent 1px) 0 0/38px 38px,
    linear-gradient(90deg,rgba(90,215,255,.045) 1px,transparent 1px) 0 0/38px 38px,
    var(--bg);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(to bottom,rgba(160,230,255,.035) 0 1px,transparent 1px 3px);
  animation:scan 1.2s linear infinite;
}
body::after{
  content:"";position:fixed;left:0;right:0;top:0;height:22vh;pointer-events:none;z-index:41;
  background:linear-gradient(to bottom,transparent,rgba(90,215,255,.055),transparent);
  animation:shimmer 7s linear infinite;
}
@keyframes scan{to{background-position:0 3px}}
@keyframes shimmer{from{transform:translateY(-25vh)}to{transform:translateY(125vh)}}

#app{
  height:100vh;display:grid;gap:10px;padding:12px 14px;
  grid-template-columns:clamp(220px,21vw,340px) minmax(0,1fr) clamp(220px,21vw,340px);
  grid-template-rows:auto minmax(0,1fr);
}

.panel{
  position:relative;min-height:0;display:flex;flex-direction:column;
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(7,30,60,.62),rgba(3,14,30,.62));
  box-shadow:0 0 14px rgba(90,215,255,.10),inset 0 0 22px rgba(90,215,255,.05);
  padding:.7em .85em .75em;
}
.panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--c);pointer-events:none;filter:drop-shadow(0 0 3px var(--c))}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.ph{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:.86em;letter-spacing:.22em;color:var(--c);text-shadow:var(--glow);
  padding-bottom:.45em;margin-bottom:.6em;border-bottom:1px solid var(--faint);flex:none;
}
.ph small{font-size:.9em;color:var(--muted);text-shadow:none;letter-spacing:.12em}

/* ---------- boot ---------- */
[data-boot]{opacity:0}
[data-boot].on{animation:flickOn .7s steps(1,end) forwards}
@keyframes flickOn{0%{opacity:0}10%{opacity:.85}18%{opacity:.1}30%{opacity:1}40%{opacity:.25}55%{opacity:1}100%{opacity:1}}
#boot{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(2,8,20,.94);transition:opacity .6s;
}
#boot.gone{opacity:0;pointer-events:none}
#bootLines{width:min(520px,86vw);font-size:1.05em;line-height:1.9;color:var(--c);text-shadow:var(--glow)}
#bootLines div{white-space:pre;overflow:hidden}
#bootLines .ok{color:var(--c-hi)}

/* ---------- header ---------- */
header{
  grid-column:1/-1;display:flex;align-items:flex-end;gap:28px;
  padding:.2em .2em .55em;border-bottom:1px solid var(--faint);
}
.brand .logo{font-size:2.1em;font-weight:700;letter-spacing:.32em;color:var(--c-hi);text-shadow:0 0 10px rgba(90,215,255,.9),0 0 22px rgba(90,215,255,.45)}
.brand .sub{font-size:.8em;letter-spacing:.3em;color:var(--muted);margin-top:.2em}
.brand .obj{font-size:.95em;letter-spacing:.14em;color:var(--c);margin-top:.45em;text-shadow:var(--glow)}
.brand .obj span{color:var(--c-hi)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:.15em}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:.32em .75em;
  border:1px solid var(--line);font-size:.82em;letter-spacing:.2em;color:var(--c-hi);
  background:rgba(90,215,255,.06);
}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);animation:blink 2.4s infinite}
.pill.warn i{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.pill:nth-child(2) i{animation-delay:.6s}.pill:nth-child(3) i{animation-delay:1.2s}.pill:nth-child(4) i{animation-delay:1.8s}
@keyframes blink{0%,70%,100%{opacity:1}80%{opacity:.25}}
.clock{margin-left:auto;text-align:right}
.clock .time{font-size:2.9em;font-weight:300;letter-spacing:.08em;color:var(--c-hi);text-shadow:0 0 12px rgba(90,215,255,.8);line-height:1;font-variant-numeric:tabular-nums}
.clock .time .hs{font-size:.5em;color:var(--c)}
.clock .meta{font-size:.82em;letter-spacing:.2em;color:var(--muted);margin-top:.45em}
.clock .meta b{color:var(--c);font-weight:400}

/* ---------- columns ---------- */
.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.grow{flex:1}

.vit{margin-bottom:.62em}
.vit:last-child{margin-bottom:0}
.vl{display:flex;justify-content:space-between;font-size:.88em;letter-spacing:.14em;margin-bottom:.3em}
.vl b{font-weight:400;color:var(--c-hi);font-variant-numeric:tabular-nums}
.vb{position:relative;height:7px;border:1px solid var(--faint);
  background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(90,215,255,.12) 8px 9px)}
.vb i{position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,rgba(90,215,255,.25),var(--c));box-shadow:0 0 8px var(--c);
  transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.vit.hot .vl b{color:var(--warn)}
.vit.hot .vb i{background:linear-gradient(90deg,rgba(255,181,71,.25),var(--warn));box-shadow:0 0 8px var(--warn)}

.log{
  flex:1;min-height:0;overflow:hidden;font-size:.88em;line-height:1.6;letter-spacing:.05em;
  display:flex;flex-direction:column;justify-content:flex-end;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%);mask-image:linear-gradient(to bottom,transparent,#000 22%);
}
.ln{flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#86c9e2;animation:lnIn .35s ease-out}
.ln .t{color:#4f8fac}
.ln.usr{white-space:normal;color:#fff;text-shadow:var(--glow)}
.ln.jrv{white-space:normal;color:var(--c)}
.ln.warn{color:var(--warn)}
@keyframes lnIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}

/* ---------- right column ---------- */
.radarWrap{display:flex;gap:10px;align-items:stretch;height:clamp(96px,17vh,170px)}
#radar{height:100%;aspect-ratio:1/1;display:block}
.contacts{flex:1;min-width:0;font-size:.82em;line-height:1.7;letter-spacing:.1em;overflow:hidden}
.contacts div{display:flex;justify-content:space-between;gap:6px;color:var(--muted)}
.contacts div b{font-weight:400;color:var(--c-hi)}
#wave{width:100%;height:clamp(44px,7.5vh,80px);display:block}

/* ---------- center ---------- */
.center{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.orbZone{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;gap:6px}
.orbWrap{
  --e:0;position:relative;height:100%;max-width:100%;aspect-ratio:1/1;cursor:pointer;border-radius:50%;
  outline:none;
}
.orbWrap:focus-visible{box-shadow:0 0 0 1px var(--c)}
.orbWrap svg,.orbWrap canvas{position:absolute;inset:0;width:100%;height:100%}
.orbWrap svg{opacity:calc(.6 + var(--e) * .4);filter:drop-shadow(0 0 3px rgba(90,215,255,.7))}
.orbWrap svg circle{fill:none;stroke:var(--c)}
.spinA{transform-origin:200px 200px;animation:spin 46s linear infinite}
.spinB{transform-origin:200px 200px;animation:spin 30s linear infinite reverse}
.spinC{transform-origin:200px 200px;animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body[data-state="listening"] .spinA{animation-duration:10s}
body[data-state="listening"] .spinB{animation-duration:7s}
body[data-state="speaking"] .spinA,body[data-state="processing"] .spinA{animation-duration:16s}
body[data-state="speaking"] .spinB,body[data-state="processing"] .spinB{animation-duration:11s}
.orbLabel{
  position:absolute;left:50%;bottom:6%;transform:translateX(-50%);
  font-size:.82em;letter-spacing:.32em;color:var(--c);text-shadow:var(--glow);white-space:nowrap;pointer-events:none;
}
.replyBox{width:min(760px,100%);text-align:center}
.hint{font-size:.78em;letter-spacing:.24em;color:var(--muted)}
.hint kbd{font-family:inherit;border:1px solid var(--line);padding:0 .4em;color:var(--c)}
#reply{
  min-height:2.9em;max-height:3em;overflow:hidden;margin-top:.35em;
  font-size:1.08em;line-height:1.45;letter-spacing:.08em;color:var(--c-hi);text-shadow:var(--glow);
}

/* ---------- objective ---------- */
.objective{flex:none}
.objTop{display:flex;align-items:flex-end;gap:2.4em}
.objTop label{display:block;font-size:.78em;letter-spacing:.26em;color:var(--muted);margin-bottom:.2em}
.big{font-size:2.5em;line-height:1;font-weight:300;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--c-hi);text-shadow:0 0 12px rgba(90,215,255,.7)}
.big.tgt{font-size:3.1em;font-weight:700}
.big.cur{color:var(--c)}
.delta{margin-left:auto;font-size:1em;letter-spacing:.14em;color:var(--c-hi);opacity:0}
.delta.show{animation:deltaPop 2.6s ease-out}
@keyframes deltaPop{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.segs{display:flex;gap:2px;height:11px;margin:.75em 0 .7em}
.segs i{flex:1;border:1px solid var(--faint);background:rgba(90,215,255,.04)}
.segs i.on{background:var(--c);border-color:var(--c);box-shadow:0 0 6px rgba(90,215,255,.8)}
.segs i.head{animation:blink 1s infinite}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));border-top:1px solid var(--faint)}
.stat{padding:.5em .5em 0;border-left:1px solid var(--faint)}
.stat:first-child{border-left:0;padding-left:0}
.stat span{display:block;font-size:.74em;letter-spacing:.18em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-weight:400;font-size:1.22em;margin-top:.2em;color:var(--c-hi);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.sys b{color:var(--c)}
.stat b.risk{color:var(--warn)}

/* ---------- command bar ---------- */
.cmd{display:flex;gap:8px;flex:none}
.cmd input{
  flex:1;min-width:0;height:34px;padding:0 .9em;font:inherit;letter-spacing:.12em;text-transform:uppercase;
  color:var(--c-hi);background:rgba(4,20,40,.75);border:1px solid var(--line);outline:none;
}
.cmd input::placeholder{color:#5f9fb8}
.cmd input:focus{border-color:var(--c);box-shadow:0 0 10px rgba(90,215,255,.25)}
.btn{
  height:34px;padding:0 1em;font:inherit;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;
  color:var(--c-hi);background:rgba(90,215,255,.07);border:1px solid var(--line);white-space:nowrap;
}
.btn:hover,.btn:focus-visible{background:rgba(90,215,255,.16);border-color:var(--c);box-shadow:0 0 10px rgba(90,215,255,.3);outline:none}
.btn.primary{border-color:var(--c);color:#02101f;background:var(--c);box-shadow:0 0 12px rgba(90,215,255,.45)}
.btn.primary:hover{background:var(--c-hi)}
body[data-state="listening"] #micBtn{background:var(--c);color:#02101f}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  body::before,body::after,.spinA,.spinB,.spinC{animation:none}
}
</style>
</head>
<body data-state="idle">

<div id="app">
  <header data-boot>
    <div class="brand">
      <div class="logo">J.A.R.V.I.S.</div>
      <div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
      <div class="obj">OBJECTIVE: <span id="objLine"></span></div>
    </div>
    <div class="pills" id="pills"></div>
    <div class="clock">
      <div class="time" aria-live="off"><span id="clkH">00</span>:<span id="clkM">00</span>:<span id="clkS">00</span><span class="hs">.<span id="clkC">00</span></span></div>
      <div class="meta"><span id="clkDate"></span> &nbsp;//&nbsp; SESSION <b id="sessId"></b></div>
    </div>
  </header>

  <aside class="col">
    <section class="panel" data-boot>
      <div class="ph"><span>SYSTEM VITALS</span><small id="vitStatus">NOMINAL</small></div>
      <div id="vitals"></div>
    </section>
    <section class="panel grow" data-boot>
      <div class="ph"><span>TELEMETRY</span><small>LIVE FEED</small></div>
      <div class="log" id="teleLog" aria-live="polite"></div>
    </section>
  </aside>

  <main class="center">
    <div class="orbZone" data-boot>
      <div class="orbWrap" id="orb" role="button" tabindex="0" aria-label="Talk to JARVIS">
        <svg viewBox="0 0 400 400" aria-hidden="true">
          <circle cx="200" cy="200" r="194" stroke-width="1" opacity=".55"/>
          <circle cx="200" cy="200" r="188" stroke-width="7" stroke-dasharray="1 8.843" opacity=".55"/>
          <circle cx="200" cy="200" r="186" stroke-width="12" stroke-dasharray="1.5 72.54" opacity=".9"/>
          <g class="spinA">
            <circle cx="200" cy="200" r="174" stroke-width="3" stroke-dasharray="140 40 36 120 90 60 200 407" opacity=".85"/>
            <circle cx="200" cy="200" r="168" stroke-width="1" stroke-dasharray="4 6" opacity=".45"/>
          </g>
          <circle cx="200" cy="200" r="156" stroke-width="1" opacity=".5"/>
          <circle cx="200" cy="200" r="152" stroke-width="5" stroke-dasharray="1 7.954" opacity=".5"/>
          <g class="spinB">
            <circle cx="200" cy="200" r="143" stroke-width="4" stroke-dasharray="60 30 110 70 20 609" opacity=".8"/>
            <circle cx="200" cy="200" r="137" stroke-width="1" stroke-dasharray="230 630" opacity=".7"/>
          </g>
          <g class="spinC">
            <circle cx="200" cy="200" r="128" stroke-width="1" stroke-dasharray="2 14" opacity=".4"/>
          </g>
        </svg>
        <canvas id="orbCanvas"></canvas>
        <div class="orbLabel" id="orbState">STANDBY</div>
      </div>
      <div class="replyBox">
        <div class="hint">HOLD <kbd>SPACE</kbd> OR CLICK THE CORE TO SPEAK</div>
        <div id="reply" aria-live="polite"></div>
      </div>
    </div>

    <section class="panel objective" data-boot>
      <div class="ph"><span>PRIMARY OBJECTIVE</span><small id="objDeadline"></small></div>
      <div class="objTop">
        <div><label>TARGET</label><div class="big tgt" id="objTarget">0</div></div>
        <div><label>CURRENT</label><div class="big cur" id="objCurrent">0</div></div>
        <div class="delta" id="objDelta"></div>
      </div>
      <div class="segs" id="segs"></div>
      <div class="stats" id="stats"></div>
    </section>

    <form class="cmd" id="cmdForm" data-boot autocomplete="off">
      <button type="button" class="btn" id="micBtn">MIC</button>
      <label class="sr" for="cmdInput">Command</label>
      <input id="cmdInput" type="text" placeholder="TYPE A COMMAND // E.G. PROGRESS, ETA, STATUS">
      <button type="submit" class="btn">SEND</button>
      <button type="button" class="btn primary" id="briefBtn">MORNING BRIEF</button>
    </form>
  </main>

  <aside class="col">
    <section class="panel" data-boot>
      <div class="ph"><span>PROXIMITY</span><small id="proxRange"></small></div>
      <div class="radarWrap">
        <canvas id="radar" aria-hidden="true"></canvas>
        <div class="contacts" id="contacts"></div>
      </div>
    </section>
    <section class="panel" data-boot>
      <div class="ph"><span>AUDIO I/O</span><small id="audioState">IDLE</small></div>
      <canvas id="wave" aria-hidden="true"></canvas>
    </section>
    <section class="panel grow" data-boot>
      <div class="ph"><span>DIAGNOSTICS</span><small>AUTO</small></div>
      <div class="log" id="diagLog"></div>
    </section>
  </aside>
</div>

<div id="boot"><div id="bootLines"></div></div>

<script>
/* ==========================================================================
   DATA — every number on the dashboard comes from this one object.
   Replace the mock values with real sources (API, CRM, spreadsheet...).
   After changing values at runtime, call JARVIS.refresh() (or the helpers
   at the bottom: JARVIS.setObjective, JARVIS.setStat, JARVIS.setVital).
   ========================================================================== */
const DATA = {

  /* Who JARVIS is talking to. Used in greetings and the brief. */
  user: {
    name: "sir"
  },

  /* PRIMARY OBJECTIVE card + the "OBJECTIVE:" line in the header. */
  objective: {
    title: "[YOUR CURRENT GOAL]",
    target: 100000,              // big number on the left
    current: 62450,              // counts up whenever it changes
    prefix: "$",                 // "" for plain numbers
    suffix: "",                  // e.g. " UNITS"
    decimals: 0,
    startDate: "2026-11-01",     // used to compute pace + ETA
    deadline: "2026-12-31",
    statusOverride: null,        // force a STATUS label, e.g. "PAUSED"; null = computed
    etaOverride: null            // force an ETA label, e.g. "Q1"; null = computed
  },

  /* Key business numbers shown in the stat row (keep 3–5).
     goal is optional and is used for recommendations in the brief. */
  stats: [
    { label: "REVENUE MTD",   value: 62450, prefix: "$", goal: 100000 },
    { label: "NEW CUSTOMERS", value: 148,                goal: 220 },
    { label: "CONVERSION",    value: 3.4, suffix: "%", decimals: 1, goal: 4.0 },
    { label: "AVG ORDER",     value: 421, prefix: "$", goal: 450 }
  ],

  /* SYSTEM VITALS — six bars, 0–100. warnAt turns a bar amber. */
  vitals: [
    { label: "CPU CORE",     value: 42, warnAt: 85 },
    { label: "MEMORY",       value: 58, warnAt: 85 },
    { label: "NETWORK",      value: 71, warnAt: 95 },
    { label: "POWER CELL",   value: 93, warnAt: 101 },
    { label: "THERMAL",      value: 37, warnAt: 80 },
    { label: "NEURAL LINK",  value: 66, warnAt: 95 }
  ],

  /* Header status pills. state: "ok" | "warn" */
  pills: [
    { label: "ONLINE",    state: "ok" },
    { label: "SECURE",    state: "ok" },
    { label: "ENCRYPTED", state: "ok" },
    { label: "AUTO-LVL8", state: "ok" }
  ],

  /* PROXIMITY radar. bearing in degrees (0 = north), distance 0–1 of range. */
  proximity: {
    range: "5 KM",
    contacts: [
      { label: "ALPHA",   bearing: 38,  distance: 0.62 },
      { label: "BRAVO",   bearing: 142, distance: 0.35 },
      { label: "CHARLIE", bearing: 251, distance: 0.81 },
      { label: "DELTA",   bearing: 310, distance: 0.48 }
    ]
  },

  /* Ambient log lines. {n} becomes a random 2-digit number. */
  telemetryFeed: [
    "UPLINK HANDSHAKE ACK // LATENCY {n}MS",
    "SYNCING LEDGER ........ OK",
    "PACKET INTEGRITY 99.{n}%",
    "SAT RELAY {n} LOCKED",
    "CACHE WARM // {n} NODES ACTIVE",
    "INBOUND QUEUE CLEARED",
    "SNAPSHOT VERIFIED // HASH 0x{n}F{n}",
    "SIGNAL STRENGTH {n} DBM",
    "ORDER STREAM POLLED ........ OK",
    "ANALYTICS BATCH {n} INGESTED"
  ],
  diagnosticsFeed: [
    "MEMORY SWEEP // 0 LEAKS",
    "THERMAL ENVELOPE NOMINAL",
    "SUBSYSTEM AUDIT PASSED",
    "FIREWALL RULESET V{n} ACTIVE",
    "ENCRYPTION KEYS ROTATED",
    "DISK IO {n}MB/S",
    "WATCHDOG HEARTBEAT OK",
    "VOICE MODULE CALIBRATED",
    "SENSOR ARRAY DRIFT 0.0{n}",
    "THREAD POOL {n}/64 BUSY"
  ],

  /* MORNING BRIEF. Leave recommendations empty to let JARVIS compute
     three from the data, or supply your own three strings. */
  brief: {
    recommendations: []
  },

  settings: {
    simulate: true,             // jitter vitals + occasional objective gains. Set false once wired to real data.
    voiceLang: "en-GB",
    voiceRate: 1.0,
    voicePitch: 0.9,
    telemetryIntervalMs: 3000,
    diagnosticsIntervalMs: 4200,
    orbParticles: 720            // lower (e.g. 450) for very old machines
  }
};

/* ==========================================================================
   ASSISTANT BRAIN — replace getAssistantReply() with a call to your own
   LLM / backend if you want open-ended answers. It receives the user's
   text and must return a string (or null if it handled things itself).
   ========================================================================== */
async function getAssistantReply(text) {
  const t = text.toLowerCase();
  const o = DATA.objective, info = objectiveInfo();
  const name = DATA.user.name;

  if (/\b(brief|briefing|morning)\b/.test(t)) { runBrief(); return null; }
  if (/\b(introduce yourself|tell me about yourself|who are you|what are you|what is your name|what's your name|whats your name)\b/.test(t))
    return `Allow me to introduce myself. I am JARVIS, a personal assistant built to run mission control for ${name}'s projects. I keep an eye on the numbers, flag what needs attention, and help turn ideas into action. Think of me as the quiet voice in the background that never sleeps.`;
  if (/\b(what do you do|what can you do|how do you work|what are you for)\b/.test(t))

  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  rotY += dt * (.16 + e * .85);
  const rotX = .42 + Math.sin(t * .00013) * .16;
  const cY = Math.cos(rotY), sY = Math.sin(rotY), cX = Math.cos(rotX), sX = Math.sin(rotX);
  const base = Math.max(1.1, R * .024) * (1 + e * .3);
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < TOTAL; i++) {
    const wob = 1 + e * .07 * Math.sin(t * .005 + i * .37);
    const x = pts[i * 3] * wob, y = pts[i * 3 + 1] * wob, z = pts[i * 3 + 2] * wob;
    const x1 = x * cY + z * sY, z1 = -x * sY + z * cY;
    const y1 = y * cX - z1 * sX, z2 = y * sX + z1 * cX;
    const p = 3 / (3 - z2), px = cx + x1 * R * p, py = cy + y1 * R * p;
    const depth = (z2 + 1) / 2, core = i >= N;
    const size = base * (core ? .7 : (.5 + depth * .95));
    ctx.globalAlpha = Math.min(1, (core ? .35 : .1 + depth * .78) * (.75 + e * .6));
    ctx.drawImage(sprite, px - size, py - size, size * 2, size * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

let sweep = 0;
const TAU = Math.PI * 2;
function drawRadar(dt) {
  const s = sizes.get(radarC); if (!s) return;
  const { w, h, d } = s, ctx = radX, cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 3 * d;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "rgba(90,215,255,.28)"; ctx.lineWidth = 1 * d;
  for (let k = 1; k <= 4; k++) { ctx.beginPath(); ctx.arc(cx, cy, r * k / 4, 0, TAU); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
  ctx.strokeStyle = "rgba(90,215,255,.6)";
  for (let a = 0; a < 36; a++) {
    const ang = a / 36 * TAU, l = a % 9 === 0 ? 7 : 3;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
    ctx.lineTo(cx + Math.cos(ang) * (r - l * d), cy + Math.sin(ang) * (r - l * d)); ctx.stroke();
  }
  sweep = (sweep + dt * 1.5) % TAU;
  for (let k = 0; k < 28; k++) {
    const a1 = sweep - k * .035;
    ctx.fillStyle = `rgba(90,215,255,${(1 - k / 28) * .22})`;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a1 - .036, a1); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = "rgba(190,242,255,.95)"; ctx.lineWidth = 1.5 * d;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(sweep) * r, cy + Math.sin(sweep) * r); ctx.stroke();
  ctx.font = `${8 * d}px ${getComputedStyle(document.body).fontFamily}`;
  for (const c of DATA.proximity.contacts) {
    const ang = (c.bearing - 90) * Math.PI / 180;
    const diff = ((sweep - ang) % TAU + TAU) % TAU;
    const it = Math.max(0, 1 - diff / (TAU * .7));
    const bx = cx + Math.cos(ang) * r * c.distance, by = cy + Math.sin(ang) * r * c.distance;
    ctx.globalAlpha = .18 + it * .82;
    ctx.drawImage(sprite, bx - 6 * d, by - 6 * d, 12 * d, 12 * d);
    if (diff < .9) {
      ctx.strokeStyle = `rgba(90,215,255,${1 - diff / .9})`; ctx.lineWidth = 1 * d;
      ctx.beginPath(); ctx.arc(bx, by, (3 + diff * 9) * d, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

let waveAmp = 0, wavePhase = 0;
function drawWave(dt, t) {
  const s = sizes.get(waveC); if (!s) return;
  const { w, h, d } = s, ctx = wavX, mid = h / 2;
  let target = 0;
  if (state === "listening") target = .12 + voiceEnergy * .78;
  else if (state === "speaking") target = .45 + .4 * Math.abs(Math.sin(t / 170) * Math.sin(t / 410));
  else if (state === "processing") target = .1;
  waveAmp += (target - waveAmp) * Math.min(1, dt * 7);
  voiceEnergy *= Math.pow(.25, dt);
  wavePhase += dt * (3 + waveAmp * 9);
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "rgba(90,215,255,.15)"; ctx.lineWidth = 1 * d;
  for (let x = 0; x < w; x += 12 * d) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  const layers = [[1, 1.6, 0], [.45, 1, 1.3], [.25, 1, 2.6]];
  for (const [alpha, lw, off] of layers) {
    ctx.strokeStyle = `rgba(150,232,255,${alpha})`;
    ctx.lineWidth = lw * d;
    ctx.shadowColor = "rgba(90,215,255,.9)";
    ctx.shadowBlur = alpha === 1 ? 6 * d : 0;
    ctx.beginPath();
    for (let x = 0; x <= w; x += 2 * d) {
      const nx = x / w, env = Math.sin(Math.PI * nx);
      const y = mid + env * waveAmp * h * .42 * (
        Math.sin(nx * 17 + wavePhase * (1 + off * .25) + off) * .6 +
        Math.sin(nx * 43 - wavePhase * 1.8 + off) * .28 +
        Math.sin(nx * 91 + wavePhase * 2.6) * .12);
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
}

/* ---------- clock ---------- */
const clk = { h: $("#clkH"), m: $("#clkM"), s: $("#clkS"), c: $("#clkC"), date: $("#clkDate") };
let lastSec = -1;
function updateClock() {
  const d = new Date();
  clk.c.textContent = pad(Math.floor(d.getMilliseconds() / 10));
  const s = d.getSeconds();
  if (s === lastSec) return;
  lastSec = s;
  clk.h.textContent = pad(d.getHours()); clk.m.textContent = pad(d.getMinutes()); clk.s.textContent = pad(s);
  clk.date.textContent = d.toLocaleDateString("en-US", { weekday: "short", day: "2-digit", month: "short", year: "numeric" }).toUpperCase().replace(/,/g, "");
}

/* ---------- main loop ---------- */
const orbWrap = $("#orb");
let last = performance.now(), energy = 0, lastE = -1;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  const target = { idle: 0, listening: .45, processing: .6, speaking: .85 }[state];
  energy += (target - energy) * Math.min(1, dt * 4);
  let e = energy;
  if (state === "speaking") e *= .72 + .28 * Math.abs(Math.sin(now / 95) * Math.sin(now / 260));
  if (state === "listening") e = Math.max(e, .35 + voiceEnergy * .55);
  if (Math.abs(e - lastE) > .01) { orbWrap.style.setProperty("--e", e.toFixed(2)); lastE = e; }
  drawOrb(dt, now, e);
  drawRadar(dt);
  drawWave(dt, now);
  updateClock();
  requestAnimationFrame(frame);
}

/* ---------- events ---------- */
orbWrap.addEventListener("click", () => {
  if (state === "speaking") { stopSpeaking(); setState("idle"); startListening("click"); }
  else toggleListening();
});
orbWrap.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); toggleListening(); }
});
$("#micBtn").addEventListener("click", toggleListening);
$("#briefBtn").addEventListener("click", () => runBrief());
$("#cmdForm").addEventListener("submit", e => {
  e.preventDefault();
  const inp = $("#cmdInput"), v = inp.value;
  inp.value = "";
  handleInput(v);
});
const isTyping = el => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
document.addEventListener("keydown", e => {
  if (e.code !== "Space" || isTyping(e.target)) return;
  e.preventDefault();
  if (e.repeat || listening) return;
  startListening("hold");
});
document.addEventListener("keyup", e => {
  if (e.code !== "Space" || isTyping(e.target)) return;
  e.preventDefault();
  if (listenMode === "hold") stopListening();
});
const unlock = e => {
  if (!pendingSpeech) return;
  const p = pendingSpeech;
  pendingSpeech = null;
  if ((e.type === "keydown" && e.code === "Space") || orbWrap.contains(e.target)) return;
  speak(p.text, { subtitles: p.subtitles, log: false });
};
document.addEventListener("pointerdown", unlock, true);
document.addEventListener("keydown", unlock, true);

/* ---------- feeds + simulation ---------- */
function startFeeds() {
  const loop = (fn, ms) => { const tick = () => { fn(); setTimeout(tick, ms * rand(.7, 1.3)); }; setTimeout(tick, ms * rand(.3, .8)); };
  loop(() => tele(fillN(DATA.telemetryFeed[Math.floor(Math.random() * DATA.telemetryFeed.length)])), DATA.settings.telemetryIntervalMs);
  loop(() => diag(fillN(DATA.diagnosticsFeed[Math.floor(Math.random() * DATA.diagnosticsFeed.length)])), DATA.settings.diagnosticsIntervalMs);
  if (!DATA.settings.simulate) return;
  setInterval(() => {
    DATA.vitals.forEach((v, i) => { vitalShown[i] = clamp(v.value + rand(-7, 7), 2, 100); });
    renderVitals();
  }, 1600);
  loop(() => {
    const o = DATA.objective;
    if (o.current >= o.target) return;
    const gain = Math.round(rand(.002, .008) * o.target);
    o.current = Math.min(o.target, o.current + gain);
    const rev = DATA.stats.find(s => /revenue/i.test(s.label));
    if (rev && o.prefix === rev.prefix) rev.value = o.current;
    renderObjective();
    tele(`OBJECTIVE UPDATE › +${fmtObj(gain)}`);
  }, 22000);
}

/* ---------- boot ---------- */
async function boot() {
  const box = $("#bootLines");
  const steps = [
    ["BIOS INTEGRITY CHECK", "OK"],
    ["LOADING CORE MODULES", "OK"],
    ["ESTABLISHING SECURE CHANNEL", "OK"],
    ["CALIBRATING SENSOR ARRAY", "OK"],
    ["VOICE INTERFACE", SR ? "READY" : "TEXT ONLY"],
    ["SPEECH SYNTHESIS", synth ? "READY" : "OFFLINE"]
  ];
  const fast = reduceMotion ? 0 : 1;
  for (const [label, res] of steps) {
    const ln = document.createElement("div");
    ln.innerHTML = `<span></span> <span class="ok"></span>`;
    ln.children[0].textContent = (label + " ").padEnd(34, ".");
    box.append(ln);
    await wait(150 * fast);
    ln.children[1].textContent = res;
    await wait(70 * fast);
  }
  await wait(300 * fast);
  $("#boot").classList.add("gone");
  await wait(250 * fast);
  for (const el of document.querySelectorAll("[data-boot]")) {
    el.classList.add("on");
    await wait(140 * fast);
  }
  renderAll();
  tele("SYSTEM ONLINE // SESSION " + $("#sessId").textContent);
  diag("ALL SUBSYSTEMS NOMINAL");
  startFeeds();
  await wait(500 * fast);
  const info = objectiveInfo();
  speak(`${partOfDay()}, ${DATA.user.name}. All systems are online. Your objective is at ${info.pct.toFixed(0)} percent. Hold space or tap the core to talk, or ask for your morning brief.`);
  setTimeout(() => $("#boot").remove(), 1200);
}

/* ---------- public API for wiring real data ---------- */
window.JARVIS = {
  DATA,
  refresh: renderAll,
  setObjective(current) { DATA.objective.current = current; renderObjective(); },
  setStat(labelOrIndex, value) {
    const s = typeof labelOrIndex === "number" ? DATA.stats[labelOrIndex] : DATA.stats.find(x => x.label === labelOrIndex);
    if (s) { s.value = value; renderObjective(); }
  },
  setVital(labelOrIndex, value) {
    const i = typeof labelOrIndex === "number" ? labelOrIndex : DATA.vitals.findIndex(x => x.label === labelOrIndex);
    if (i >= 0) { DATA.vitals[i].value = value; vitalShown[i] = value; renderVitals(); }
  },
  log: m => tele(m),
  diag: m => diag(m),
  say: t => speak(t),
  brief: runBrief,
  listen: () => startListening("click")
};

/* ---------- init ---------- */
$("#sessId").textContent = "JRV-" + Math.random().toString(16).slice(2, 6).toUpperCase() + "-" + Math.random().toString(16).slice(2, 6).toUpperCase();
$("#objLine").textContent = DATA.objective.title;
buildStatic();
setState("idle");
updateClock();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
boot();
})();
</script>
